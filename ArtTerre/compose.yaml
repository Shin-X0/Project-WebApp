services:
  arterre_mysql:
    image: mysql:latest
    container_name: arterre_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3311:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - arterre_db_data:/var/lib/mysql
    networks:
      - arterre_network

  arterre_phpmyadmin:
    image: phpmyadmin
    container_name: arterre_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: arterre_mysql
    ports:
      - "8080:80"
    networks:
      - arterre_network

volumes:
  arterre_db_data:

networks:
  arterre_network:
