security:
    # https://symfony.com/doc/current/security.html#registering-the-passwords
    # Old users.password_hash columns hold bcrypt ("$2y$...") hashes —
    # the auto hasher verifies them natively.
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        main:
            lazy: true
            provider: app_user_provider

            # Authenticates against the users table (old pages/login.php flow,
            # incl. the 5-tries / 5-minute lockout) — see the authenticator class.
            custom_authenticator: App\Security\LoginFormAuthenticator
            logout:
                path: app_logout
                target: app_home

            # on_login: implement a custom success handler to redirect admins
            # to the admin dashboard (matches the old admin/index.php check).

    # Note: Only the *first* matching rule is applied
    access_control:
        # Old admin/ folder was guarded by is_admin() — same rule here.
        - { path: ^/admin, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon

